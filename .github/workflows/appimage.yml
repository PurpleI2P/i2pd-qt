name: AppImage

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            make \
            qt5-qmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            libqt5gui5 \
            libqt5widgets5 \
            libqt5svg5 \
            libqt5svg5-dev \
            libssl-dev \
            libboost-all-dev \
            libminiupnpc-dev \
            zlib1g-dev \
            file \
            wget \
            patchelf \
            desktop-file-utils \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libgl1-mesa-dev \
            qt5-gtk-platformtheme \
            libqt5xdg3

      - name: Build i2pd-qt
        run: |
          qmake i2pd_qt.pro
          make -j"$(nproc)" USE_UPNP=yes

      - name: Install linuxdeploy and Qt plugin
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          install -m 755 i2pd_qt AppDir/usr/bin/i2pd_qt

          install -m 644 contrib/website.i2pd.i2pd.desktop \
            AppDir/usr/share/applications/website.i2pd.i2pd.desktop

          if [ -f contrib/icons/256x256/apps/website.i2pd.i2pd.png ]; then
            install -m 644 contrib/icons/256x256/apps/website.i2pd.i2pd.png \
              AppDir/usr/share/icons/hicolor/256x256/apps/website.i2pd.i2pd.png
            cp AppDir/usr/share/icons/hicolor/256x256/apps/website.i2pd.i2pd.png \
               AppDir/website.i2pd.i2pd.png
          elif [ -f contrib/icons/128x128/apps/website.i2pd.i2pd.png ]; then
            install -m 644 contrib/icons/128x128/apps/website.i2pd.i2pd.png \
              AppDir/usr/share/icons/hicolor/128x128/apps/website.i2pd.i2pd.png
            cp AppDir/usr/share/icons/hicolor/128x128/apps/website.i2pd.i2pd.png \
               AppDir/website.i2pd.i2pd.png
          else
            echo "ERROR: icon not found"
            exit 1
          fi

          # appdata.xml НЕ копируем.
          # appdata.xml не проходит строгую валидацию appstreamcli
          # и ломает создание AppImage:
          # [appimage/stdout]   I: website.i2pd.i2pd:4: cid-maybe-not-rdns website.i2pd.i2pd
          # [appimage/stdout]   I: website.i2pd.i2pd:12: unknown-tag developer
          # [appimage/stderr] ::error::Failed to validate AppStream information with appstreamcli
          # [appimage/stdout]   I: website.i2pd.i2pd:17: description-first-para-too-short
          # [appimage/stdout]        i2pd (I2P Daemon) is a full-featured C++ implementation of I2P client.
          # [appimage/stdout]   W: website.i2pd.i2pd:44: url-invalid-type vcs-browser
          # [appimage/stdout] ✘ Validation failed: warnings: 1, infos: 3

      - name: Bundle Qt and runtime libraries
        env:
          QMAKE: qmake
          # доп. platform plugins (для диагностики и headless)
          EXTRA_PLATFORM_PLUGINS: libqminimal.so;libqoffscreen.so
          EXTRA_QT_MODULES: svg
        run: |
          ./linuxdeploy \
            --appdir AppDir \
            --plugin qt \
            --executable AppDir/usr/bin/i2pd_qt \
            --desktop-file AppDir/usr/share/applications/website.i2pd.i2pd.desktop \
            --icon-file AppDir/website.i2pd.i2pd.png

          QT_PLUGINS="$(qmake -query QT_INSTALL_PLUGINS)"
          echo "QT_INSTALL_PLUGINS=$QT_PLUGINS"

          # styles (fusion и др.)
          if [ -d "$QT_PLUGINS/styles" ]; then
            mkdir -p AppDir/usr/plugins/styles
            cp -a "$QT_PLUGINS/styles"/. AppDir/usr/plugins/styles/ || true
          fi

          # platformthemes (gtk2/gtk3) — важно при QT_QPA_PLATFORMTHEME=gtk2
          if [ -d "$QT_PLUGINS/platformthemes" ]; then
            mkdir -p AppDir/usr/plugins/platformthemes
            cp -a "$QT_PLUGINS/platformthemes"/. AppDir/usr/plugins/platformthemes/ || true
          fi

          # на всякий случай imageformats / iconengines
          for d in imageformats iconengines; do
            if [ -d "$QT_PLUGINS/$d" ]; then
              mkdir -p "AppDir/usr/plugins/$d"
              cp -a "$QT_PLUGINS/$d"/. "AppDir/usr/plugins/$d/" || true
            fi
          done

          echo "=== platforms ==="
          find AppDir -path '*/platforms/*' | sort
          echo "=== styles ==="
          find AppDir -path '*/styles/*' | sort
          echo "=== platformthemes ==="
          find AppDir -path '*/platformthemes/*' | sort
          echo "=== qt.conf ==="
          cat AppDir/usr/bin/qt.conf 2>/dev/null || echo "(no qt.conf)"

      - name: Create AppImage
        env:
          LDAI_NO_APPSTREAM: "1"
        run: |
          ./linuxdeploy --appdir AppDir --output appimage
          find . -maxdepth 1 -name '*.AppImage' -print

      - name: Rename AppImage
        run: |
          APPIMAGE="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" i2pd-qt-x86_64.AppImage
          ls -lh i2pd-qt-x86_64.AppImage
          file i2pd-qt-x86_64.AppImage

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2pd-qt-AppImage
          path: i2pd-qt-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Publish AppImage to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: i2pd-qt-x86_64.AppImage
          fail_on_unmatched_files: true
